[workspace]
resolver = "2"
members = [
    "crates/kvasir-audio",
    "crates/kvasir-deezer",
    "crates/kvasir-core",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
authors = ["soulwax <soulwax-95@protonmail.com>"]
repository = "https://github.com/soulwax/kvasir"
homepage = "https://github.com/soulwax/kvasir"
rust-version = "1.85"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.build-override]
opt-level = 0
codegen-units = 16
