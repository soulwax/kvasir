[package]
name = "kvasir-deezer"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deezer catalogue, download, decrypt, and MP3/FLAC tagging."
readme = "README.md"
keywords = ["deezer", "music", "metadata", "mp3", "flac"]
categories = ["api-bindings", "multimedia::audio"]

[features]
default = ["resolve-spotify", "resolve-tidal", "resolve-youtube", "enrich", "lyrics-fallback"]
resolve-spotify = []
resolve-tidal = []
resolve-youtube = []
enrich = []
lyrics-fallback = []

[dependencies]
aes = "0.8"
async-stream = "0.3"
bytes = "1"
cipher = "0.4"
blowfish = "0.9"
futures-core = "0.3"
futures-util = "0.3"
id3 = "1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
kvasir-audio = { path = "../kvasir-audio" }
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
