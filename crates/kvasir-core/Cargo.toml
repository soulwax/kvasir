[package]
name = "kvasir-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Acquire a track, inspect the bytes, and reconcile them with the catalogue."
readme = "README.md"
keywords = ["music", "audio", "deezer", "metadata", "tagging"]
categories = ["multimedia::audio", "api-bindings"]

[features]
default = ["resolve-spotify", "resolve-tidal", "resolve-youtube", "enrich", "lyrics-fallback"]
resolve-spotify = ["kvasir-deezer/resolve-spotify"]
resolve-tidal = ["kvasir-deezer/resolve-tidal"]
resolve-youtube = ["kvasir-deezer/resolve-youtube"]
enrich = ["kvasir-deezer/enrich"]
lyrics-fallback = ["kvasir-deezer/lyrics-fallback"]

[dependencies]
bytes = "1"
kvasir-audio = { version = "0.1.0", path = "../kvasir-audio" }
kvasir-deezer = { version = "0.1.0", path = "../kvasir-deezer", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
