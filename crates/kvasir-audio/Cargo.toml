[package]
name = "kvasir-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded audio format detection and normalized music metadata."
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
lofty = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mkv"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
